<!DOCTYPE html>
<html lang="en" data-xf-meta-title="Payment result - Freezestack" data-xf-meta-path="checkout-success">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment result - Freezestack</title>
  <link rel="icon" type="image/png" sizes="48x48" href="https://freezestack.com/favicon-48x48.png">
  <link rel="icon" type="image/x-icon" href="https://freezestack.com/favicon.ico">
  <!--
    Legacy Dodo return URL. Bounce to pricing with the same query so the
    confirmation modal sits on top of Freezestack, not a blank page.
  -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search || '');
        if (!params.has('xf_pay')) params.set('xf_pay', '1');
        if (!params.has('provider')) params.set('provider', 'dodo');
        var qs = params.toString();
        window.location.replace('/pricing' + (qs ? '?' + qs : '?xf_pay=1&provider=dodo'));
      } catch (e) {
        window.location.replace('/pricing?xf_pay=1&provider=dodo');
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=/pricing?xf_pay=1&provider=dodo">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #eef1f0;
      color: #52525b;
      font-size: 0.9rem;
    }
    a { color: #0a0a0a; }
  </style>
</head>
<body>
  <p>Taking you back to Freezestack… <a href="/pricing?xf_pay=1&provider=dodo">Continue</a></p>
</body>
</html>
